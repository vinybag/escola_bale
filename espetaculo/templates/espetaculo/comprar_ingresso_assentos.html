{% extends 'base_public.html' %}

{% block title %}Comprar ingresso - {{ evento.titulo }}{% endblock %}

{% block content %}
<style>
    .compra-assentos-wrapper {
        width: 100%;
        max-width: 760px;
        margin: 0 auto;
        padding: 2rem 1rem 3rem;
    }

    .compra-assentos-card {
        background: #fff;
        border-radius: 18px;
        box-shadow: 0 6px 24px rgba(0, 0, 0, 0.08);
        padding: 2rem;
    }

    .compra-assentos-card h1 {
        margin: 0 0 0.5rem;
        color: #2c3e50;
    }

    .compra-assentos-card p {
        color: #666;
        line-height: 1.6;
    }

    .compra-assentos-form {
        display: grid;
        gap: 1rem;
        margin-top: 1.5rem;
    }

    .compra-assentos-form label {
        display: block;
        margin-bottom: 0.4rem;
        color: #44384c;
        font-weight: 600;
    }

    .compra-assentos-form input {
        width: 100%;
        box-sizing: border-box;
        padding: 0.85rem 0.95rem;
        border: 1px solid #d9cbe4;
        border-radius: 10px;
        font-size: 1rem;
    }

    .compra-assentos-form input:focus {
        outline: none;
        border-color: #b07a84;
        box-shadow: 0 0 0 4px rgba(176, 122, 132, 0.12);
    }

    .compra-assentos-grid {
        display: grid;
        grid-template-columns: repeat(2, minmax(0, 1fr));
        gap: 1rem;
    }

    .compra-assentos-actions {
        display: flex;
        gap: 0.75rem;
        flex-wrap: wrap;
        margin-top: 0.5rem;
    }

    .compra-assentos-button {
        display: inline-flex;
        align-items: center;
        justify-content: center;
        padding: 0.9rem 1.3rem;
        border-radius: 10px;
        text-decoration: none;
        font-weight: 700;
        border: none;
        cursor: pointer;
    }

    .compra-assentos-button-primary {
        background: #b07a84;
        color: #fff;
    }

    .compra-assentos-button-secondary {
        background: #f3f3f3;
        color: #444;
    }

    .compra-assentos-erro {
        padding: 0.85rem 1rem;
        border-radius: 10px;
        background: #fff0f0;
        color: #a33a3a;
        margin-bottom: 1rem;
    }

    @media (max-width: 640px) {
        .compra-assentos-wrapper {
            padding: 1rem 0.75rem 2rem;
        }

        .compra-assentos-card {
            padding: 1.25rem;
        }

        .compra-assentos-grid {
            grid-template-columns: 1fr;
        }

        .compra-assentos-actions {
            flex-direction: column;
        }

        .compra-assentos-button {
            width: 100%;
        }
    }
</style>

<div class="compra-assentos-wrapper">
    <div class="compra-assentos-card">
        <h1>{{ evento.titulo }}</h1>

        <p>
            Preencha seus dados. Na próxima etapa, você escolherá os assentos no mapa.
        </p>

        {% if erro %}
            <div class="compra-assentos-erro">
                {{ erro }}
            </div>
        {% endif %}

        <form method="post" class="compra-assentos-form">
            {% csrf_token %}

            <div>
                <label for="nome_completo">Nome completo *</label>
                <input
                    type="text"
                    id="nome_completo"
                    name="nome_completo"
                    required
                    value="{{ request.POST.nome_completo|default:'' }}"
                >
            </div>

            <div class="compra-assentos-grid">
                <div>
                    <label for="email">E-mail</label>
                    <input
                        type="email"
                        id="email"
                        name="email"
                        value="{{ request.POST.email|default:'' }}"
                    >
                </div>

                <div>
                    <label for="whatsapp">WhatsApp *</label>
                    <input
                        type="text"
                        id="whatsapp"
                        name="whatsapp"
                        required
                        value="{{ request.POST.whatsapp|default:'' }}"
                    >
                </div>
            </div>

            <div class="compra-assentos-grid">
                <div>
                    <label for="cpf">CPF</label>
                    <input
                        type="text"
                        id="cpf"
                        name="cpf"
                        value="{{ request.POST.cpf|default:'' }}"
                    >
                </div>
        </div>

            <div class="compra-assentos-actions">
                <a
                    href="{% url 'espetaculo:evento_detalhe_publico' evento.pk %}"
                    class="compra-assentos-button compra-assentos-button-secondary"
                >
                    Voltar
                </a>

                <button
                    type="submit"
                    class="compra-assentos-button compra-assentos-button-primary"
                >
                    Escolher assentos
                </button>
            </div>
        </form>
    </div>
</div>
{% endblock %}
