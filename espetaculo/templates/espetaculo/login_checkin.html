{% extends 'base.html' %}

{% block content %}
<div style="max-width: 400px; margin: 60px auto;">
    <h2>Acesso ao Check-in</h2>

    {% if erro %}
        <p style="color: red;">{{ erro }}</p>
    {% endif %}

    <form method="post">
        {% csrf_token %}
        <input type="text" name="username" placeholder="Usuário" required style="width: 100%; padding: 10px; margin-bottom: 10px;">
        <input type="password" name="password" placeholder="Senha" required style="width: 100%; padding: 10px; margin-bottom: 10px;">
        <button type="submit" style="width: 100%; padding: 10px;">Entrar</button>
    </form>
</div>
{% endblock %}
