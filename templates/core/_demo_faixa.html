{% if DEMO_MODE %}
<style>
    .demo-faixa { position: fixed; left: 0; right: 0; bottom: 0; z-index: 9999; background: #4a235f; color: #fff; padding: .55rem 1rem; display: flex; gap: .8rem; align-items: center; justify-content: center; flex-wrap: wrap; font: 600 .85rem/1.3 -apple-system, "Segoe UI", Arial, sans-serif; box-shadow: 0 -2px 10px rgba(0,0,0,.2); }
    .demo-faixa span { opacity: .9; font-weight: 500; }
    .demo-faixa form { margin: 0; }
    .demo-faixa button { background: #fff; color: #4a235f; border: 0; border-radius: 8px; padding: .4rem .8rem; font-weight: 700; cursor: pointer; font-size: .82rem; }
    body { padding-bottom: 3.4rem; }
</style>
<div class="demo-faixa">
    <span>Ambiente de demonstração: os dados são fictícios e voltam ao início todo dia. Não digite dados reais.</span>
    <form method="post" action="/demo/entrar/administradora/">{% csrf_token %}<button type="submit">Entrar como administradora</button></form>
    <form method="post" action="/demo/entrar/responsavel/">{% csrf_token %}<button type="submit">Entrar como responsável</button></form>
</div>
{% endif %}
