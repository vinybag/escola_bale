{% extends 'admin_dashboard/base.html' %}

{% block title %}Editar Maquiagem{% endblock %}

{% block content %}

<style>
    /* =========================================================
       EDITAR MAQUIAGEM
       ========================================================= */

    .maq-page {
        width: 100%;
        max-width: 100%;
        min-width: 0;
        box-sizing: border-box;
    }

    .maq-shell {
        width: 100%;
        max-width: 700px;
        min-width: 0;
        margin: 0;
        box-sizing: border-box;
    }

    .maq-title {
        margin: 0 0 1.25rem 0;
        color: #4a235f;
        font-size: 1.5rem;
        line-height: 1.2;
        word-break: break-word;
    }

    .maq-card {
        width: 100%;
        max-width: 100%;
        min-width: 0;
        box-sizing: border-box;

        background: #ffffff;
        border: 1px solid #ece3f2;
        border-radius: 18px;
        box-shadow: 0 4px 16px rgba(107, 45, 143, 0.07);

        padding: 1.25rem;
    }

    .maq-form {
        width: 100%;
        min-width: 0;

        display: grid;
        grid-template-columns: repeat(2, minmax(0, 1fr));
        gap: 1rem;

        box-sizing: border-box;
    }

    .maq-field {
        width: 100%;
        min-width: 0;

        display: flex;
        flex-direction: column;
        gap: 0.35rem;

        box-sizing: border-box;
    }

    .maq-field label {
        font-size: 0.75rem;
        font-weight: 700;
        color: #7a7280;
        text-transform: uppercase;
        letter-spacing: 0.03em;

        line-height: 1.2;
    }

    .maq-field input,
    .maq-field select {
        display: block;

        width: 100%;
        min-width: 0;
        max-width: 100%;

        height: 42px;
        padding: 0.6rem 0.7rem;

        border: 1px solid #ddd;
        border-radius: 8px;

        font-family: inherit;
        font-size: 0.9rem;
        color: #3f3548;
        background: #ffffff;

        box-sizing: border-box;
        outline: none;
    }

    .maq-field input:focus,
    .maq-field select:focus {
        border-color: #7e3aa5;
        box-shadow: 0 0 0 3px rgba(126, 58, 165, 0.10);
    }

    .maq-field select:disabled {
        background: #f5f3f6;
        color: #999;
        cursor: not-allowed;
    }

    .maq-submit {
        grid-column: 1 / -1;

        width: 100%;
        min-width: 0;

        display: flex;
        justify-content: flex-end;
        align-items: center;

        gap: 0.75rem;

        margin-top: 0.25rem;
    }

    .maq-btn,
    .maq-cancelar {
        min-height: 42px;
        box-sizing: border-box;

        display: inline-flex;
        align-items: center;
        justify-content: center;

        padding: 0.7rem 1.3rem;

        border-radius: 10px;

        font-family: inherit;
        font-size: 0.9rem;
        font-weight: 700;

        white-space: nowrap;
        text-decoration: none;

        transition:
            transform 0.15s ease,
            box-shadow 0.15s ease,
            opacity 0.15s ease;
    }

    .maq-btn {
        background: linear-gradient(
            135deg,
            #6b2d8f 0%,
            #7e3aa5 100%
        );

        color: #ffffff;
        border: none;

        cursor: pointer;

        box-shadow: 0 8px 18px rgba(107, 45, 143, 0.18);
    }

    .maq-btn:hover {
        transform: translateY(-1px);
        box-shadow: 0 10px 22px rgba(107, 45, 143, 0.24);
    }

    .maq-cancelar {
        background: #f3f3f3;
        color: #44384c;
        border: 1px solid #ddd;

        font-weight: 600;
    }

    .maq-cancelar:hover {
        background: #eaeaea;
    }

    /* =========================================================
       TABLET
       ========================================================= */

    @media (max-width: 700px) {
        .maq-shell {
            max-width: 100%;
        }
    }

    /* =========================================================
       CELULAR
       ========================================================= */

    @media (max-width: 640px) {

        .maq-page {
            width: 100%;
        }

        .maq-title {
            font-size: 1.3rem;
            margin-bottom: 1rem;
        }

        .maq-card {
            padding: 1rem;
            border-radius: 14px;
        }

        .maq-form {
            grid-template-columns: minmax(0, 1fr);
            gap: 0.9rem;
        }

        .maq-submit {
            flex-direction: column-reverse;
            align-items: stretch;
            gap: 0.65rem;
        }

        .maq-btn,
        .maq-cancelar {
            width: 100%;
            max-width: 100%;
        }
    }

    /* =========================================================
       CELULARES MUITO PEQUENOS
       ========================================================= */

    @media (max-width: 380px) {

        .maq-card {
            padding: 0.85rem;
            border-radius: 12px;
        }

        .maq-title {
            font-size: 1.2rem;
        }

        .maq-field input,
        .maq-field select {
            font-size: 0.85rem;
        }

        .maq-btn,
        .maq-cancelar {
            font-size: 0.85rem;
            padding-left: 1rem;
            padding-right: 1rem;
        }
    }
</style>


<div class="maq-page">

    <div class="maq-shell">

        <h2 class="maq-title">
            Editar agendamento
        </h2>

        <div class="maq-card">

            <form method="post" class="maq-form">

                {% csrf_token %}

                <div class="maq-field">
                    <label for="id_aluna">Aluna</label>
                    <select id="id_aluna" name="aluna" required>
                        {% for aluna in alunas_da_turma %}
                            <option
                                value="{{ aluna.pk }}"
                                {% if aluna.pk == agendamento.aluna_id %}selected{% endif %}
                            >{{ aluna.nome }}</option>
                        {% endfor %}
                    </select>
                </div>

                <div class="maq-field">
                    <label for="id_tipo_servico">Tipo de serviço</label>
                    <select id="id_tipo_servico" name="tipo_servico" required>
                        {% for valor, rotulo in tipos_servico %}
                            <option
                                value="{{ valor }}"
                                {% if valor == agendamento.tipo_servico %}selected{% endif %}
                            >{{ rotulo }}</option>
                        {% endfor %}
                    </select>
                </div>

                <div class="maq-field">
                    <label for="id_horario">Horário e maquiadora</label>
                    <select id="id_horario" name="horario" required>
                        {% for h in horarios_disponiveis_para_troca %}
                            <option
                                value="{{ h.pk }}"
                                {% if h.pk == agendamento.horario_id %}selected{% endif %}
                            >{{ h.horario|date:"d/m/Y H:i" }} ({{ h.duracao_minutos }} min) · {{ h.agenda.maquiadora }}{% if h.pk == agendamento.horario_id %} · atual{% endif %}</option>
                        {% endfor %}
                    </select>
                </div>

                <div class="maq-submit">
                    <a class="maq-cancelar" href="{{ voltar_url }}">Cancelar</a>
                    <button type="submit" class="maq-btn">Salvar alterações</button>
                </div>

            </form>

        </div>

    </div>

</div>

{% endblock %}
