{% extends 'admin_dashboard/base.html' %}

{% block title %}Editar Maquiagem{% endblock %}

{% block content %}

<style>
    /* =========================================================
       EDITAR MAQUIAGEM
       ========================================================= */

    .maq-page {
        width: 100%;
        max-width: 100%;
        min-width: 0;
        box-sizing: border-box;
    }

    .maq-shell {
        width: 100%;
        max-width: 700px;
        min-width: 0;
        margin: 0 auto;
        box-sizing: border-box;
    }

    .maq-title {
        margin: 0 0 1.25rem 0;
        color: #4a235f;
        font-size: 1.5rem;
        line-height: 1.2;
        word-break: break-word;
    }

    .maq-card {
        width: 100%;
        max-width: 100%;
        min-width: 0;
        box-sizing: border-box;

        background: #ffffff;
        border: 1px solid #ece3f2;
        border-radius: 18px;
        box-shadow: 0 4px 16px rgba(107, 45, 143, 0.07);

        padding: 1.25rem;
    }

    .maq-form {
        width: 100%;
        min-width: 0;

        display: grid;
        grid-template-columns: repeat(2, minmax(0, 1fr));
        gap: 1rem;

        box-sizing: border-box;
    }

    .maq-field {
        width: 100%;
        min-width: 0;

        display: flex;
        flex-direction: column;
        gap: 0.35rem;

        box-sizing: border-box;
    }

    .maq-field label {
        font-size: 0.75rem;
        font-weight: 700;
        color: #7a7280;
        text-transform: uppercase;
        letter-spacing: 0.03em;

        line-height: 1.2;
    }

    .maq-field input,
    .maq-field select {
        display: block;

        width: 100%;
        min-width: 0;
        max-width: 100%;

        height: 42px;
        padding: 0.6rem 0.7rem;

        border: 1px solid #ddd;
        border-radius: 8px;

        font-family: inherit;
        font-size: 0.9rem;
        color: #3f3548;
        background: #ffffff;

        box-sizing: border-box;
        outline: none;
    }

    .maq-field input:focus,
    .maq-field select:focus {
        border-color: #7e3aa5;
        box-shadow: 0 0 0 3px rgba(126, 58, 165, 0.10);
    }

    .maq-field select:disabled {
        background: #f5f3f6;
        color: #999;
        cursor: not-allowed;
    }

    .maq-submit {
        grid-column: 1 / -1;

        width: 100%;
        min-width: 0;

        display: flex;
        justify-content: flex-end;
        align-items: center;

        gap: 0.75rem;

        margin-top: 0.25rem;
    }

    .maq-btn,
    .maq-cancelar {
        min-height: 42px;
        box-sizing: border-box;

        display: inline-flex;
        align-items: center;
        justify-content: center;

        padding: 0.7rem 1.3rem;

        border-radius: 10px;

        font-family: inherit;
        font-size: 0.9rem;
        font-weight: 700;

        white-space: nowrap;
        text-decoration: none;

        transition:
            transform 0.15s ease,
            box-shadow 0.15s ease,
            opacity 0.15s ease;
    }

    .maq-btn {
        background: linear-gradient(
            135deg,
            #6b2d8f 0%,
            #7e3aa5 100%
        );

        color: #ffffff;
        border: none;

        cursor: pointer;

        box-shadow: 0 8px 18px rgba(107, 45, 143, 0.18);
    }

    .maq-btn:hover {
        transform: translateY(-1px);
        box-shadow: 0 10px 22px rgba(107, 45, 143, 0.24);
    }

    .maq-cancelar {
        background: #f3f3f3;
        color: #44384c;
        border: 1px solid #ddd;

        font-weight: 600;
    }

    .maq-cancelar:hover {
        background: #eaeaea;
    }

    /* =========================================================
       TABLET
       ========================================================= */

    @media (max-width: 700px) {
        .maq-shell {
            max-width: 100%;
        }
    }

    /* =========================================================
       CELULAR
       ========================================================= */

    @media (max-width: 640px) {

        .maq-page {
            width: 100%;
        }

        .maq-title {
            font-size: 1.3rem;
            margin-bottom: 1rem;
        }

        .maq-card {
            padding: 1rem;
            border-radius: 14px;
        }

        .maq-form {
            grid-template-columns: minmax(0, 1fr);
            gap: 0.9rem;
        }

        .maq-submit {
            flex-direction: column-reverse;
            align-items: stretch;
            gap: 0.65rem;
        }

        .maq-btn,
        .maq-cancelar {
            width: 100%;
            max-width: 100%;
        }
    }

    /* =========================================================
       CELULARES MUITO PEQUENOS
       ========================================================= */

    @media (max-width: 380px) {

        .maq-card {
            padding: 0.85rem;
            border-radius: 12px;
        }

        .maq-title {
            font-size: 1.2rem;
        }

        .maq-field input,
        .maq-field select {
            font-size: 0.85rem;
        }

        .maq-btn,
        .maq-cancelar {
            font-size: 0.85rem;
            padding-left: 1rem;
            padding-right: 1rem;
        }
    }
</style>


<div class="maq-page">

    <div class="maq-shell">

        <h2 class="maq-title">
            Editar maquiagem
        </h2>

        <div class="maq-card">

            <form method="post" class="maq-form">

                {% csrf_token %}

                <div class="maq-field">

                    <label for="id_turma">
                        Turma
                    </label>

                    <select id="id_turma" name="turma" required>

                        {% for turma in turmas %}

                            <option
                                value="{{ turma.pk }}"
                                {% if turma.pk == maquiagem.turma_id %}
                                    selected
                                {% endif %}
                            >
                                {{ turma.nome }}
                            </option>

                        {% endfor %}

                    </select>

                </div>


                <div class="maq-field">

                    <label for="id_aluna">
                        Aluna
                    </label>

                    <select id="id_aluna" name="aluna" required>

                        {% for aluna in alunas_da_turma %}

                            <option
                                value="{{ aluna.pk }}"
                                {% if aluna.pk == maquiagem.aluna_id %}
                                    selected
                                {% endif %}
                            >
                                {{ aluna.nome }}
                            </option>

                        {% endfor %}

                    </select>

                </div>


                <div class="maq-field">

                    <label for="id_horario">
                        Horário
                    </label>

                    <input
                        type="time"
                        id="id_horario"
                        name="horario"
                        value="{{ maquiagem.horario|time:'H:i' }}"
                        required
                    >

                </div>


                <div class="maq-field">

                    <label for="id_maquiadora">
                        Maquiadora
                    </label>

                    <input
                        type="text"
                        id="id_maquiadora"
                        name="maquiadora"
                        value="{{ maquiagem.maquiadora }}"
                        required
                    >

                </div>


                <div class="maq-field">

                    <label for="id_duracao">
                        Duração (minutos)
                    </label>

                    <input
                        type="number"
                        id="id_duracao"
                        name="duracao_minutos"
                        min="1"
                        value="{{ maquiagem.duracao_minutos }}"
                        required
                    >

                </div>


                <div class="maq-submit">

                    <a
                        class="maq-cancelar"
                        href="{% url 'admin_dashboard:espetaculo_maquiagens' maquiagem.espetaculo_id %}"
                    >
                        Cancelar
                    </a>

                    <button
                        type="submit"
                        class="maq-btn"
                    >
                        Salvar alterações
                    </button>

                </div>

            </form>

        </div>

    </div>

</div>


<script>
document.addEventListener('DOMContentLoaded', function () {

    const selectTurma = document.getElementById('id_turma');
    const selectAluna = document.getElementById('id_aluna');

    const alunaAtualId = "{{ maquiagem.aluna_id }}";

    const URL_ALUNAS_POR_TURMA_BASE =
        "{% url 'admin_dashboard:alunas_por_turma' 999999 %}"
        .replace('999999/', '');


    if (selectTurma && selectAluna) {

        selectTurma.addEventListener('change', function () {

            const turmaId = this.value;

            selectAluna.innerHTML =
                '<option value="">Carregando...</option>';

            selectAluna.disabled = true;


            if (!turmaId) {

                selectAluna.innerHTML =
                    '<option value="">Selecione a turma primeiro</option>';

                return;
            }


            fetch(
                `${URL_ALUNAS_POR_TURMA_BASE}${turmaId}/`,
                {
                    method: 'GET',
                    credentials: 'same-origin',
                }
            )

            .then(function (response) {

                if (!response.ok) {
                    throw new Error(`Erro HTTP ${response.status}`);
                }

                return response.json();

            })

            .then(function (alunas) {

                selectAluna.innerHTML = '';


                if (alunas.length === 0) {

                    selectAluna.innerHTML =
                        '<option value="">Nenhuma aluna nesta turma</option>';

                    selectAluna.disabled = true;

                    return;
                }


                const opcaoPadrao =
                    document.createElement('option');

                opcaoPadrao.value = '';
                opcaoPadrao.textContent = 'Selecione a aluna';

                selectAluna.appendChild(opcaoPadrao);


                alunas.forEach(function (aluna) {

                    const opcao =
                        document.createElement('option');

                    opcao.value = aluna.id;
                    opcao.textContent = aluna.nome;

                    if (String(aluna.id) === alunaAtualId) {
                        opcao.selected = true;
                    }

                    selectAluna.appendChild(opcao);

                });


                selectAluna.disabled = false;

            })

            .catch(function (erro) {

                console.error(
                    'Erro ao buscar alunas:',
                    erro
                );

                selectAluna.innerHTML =
                    '<option value="">Erro ao carregar alunas</option>';

                selectAluna.disabled = true;

            });

        });

    }

});
</script>

{% endblock %}
```
