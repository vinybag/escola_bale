<style>
    .pr-page { max-width: 1100px; }
    .pr-top h2 { margin: 0 0 .3rem; color: #4a235f; }
    .pr-top p { margin: 0 0 1.1rem; color: #6f6f78; }
    .pr-tabs { display: flex; gap: .4rem; flex-wrap: wrap; margin-bottom: 1.5rem; border-bottom: 1px solid #ece3f2; }
    .pr-tabs a { padding: .7rem 1.1rem; border-radius: 10px 10px 0 0; text-decoration: none; color: #6f6f78; font-weight: 600; }
    .pr-tabs a.ativa { background: #6b2d8f; color: #fff; }
    .pr-card { background: #fff; border: 1px solid #ebe3f1; border-radius: 16px; padding: 1.4rem; margin-bottom: 1.25rem; box-shadow: 0 6px 18px rgba(107,45,143,.06); }
    .pr-card h3 { margin: 0 0 .75rem; color: #4a235f; font-size: 1.05rem; }
    .pr-sub { color: #7b7580; font-size: .9rem; margin: 0 0 1rem; line-height: 1.5; }
    .pr-lab { display: block; font-weight: 600; color: #44384c; margin: 0 0 .35rem; }
    .pr-dica { display: block; color: #8a8390; font-size: .82rem; margin-top: .3rem; line-height: 1.4; }
    .pr-input { width: 100%; box-sizing: border-box; padding: .7rem .85rem; border: 1px solid #d9cbe4; border-radius: 10px; font-size: .95rem; font-family: inherit; background: #fff; }
    .pr-input:focus { outline: none; border-color: #6b2d8f; box-shadow: 0 0 0 3px rgba(107,45,143,.1); }
    .pr-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(240px, 1fr)); gap: 1.1rem; }
    .pr-campo { margin-bottom: 1.1rem; }
    .pr-btn { display: inline-flex; align-items: center; justify-content: center; padding: .7rem 1.2rem; border: 0; border-radius: 10px; font-weight: 700; font-size: .9rem; cursor: pointer; text-decoration: none; font-family: inherit; }
    .pr-btn-p { background: linear-gradient(135deg, #6b2d8f, #7e3aa5); color: #fff; }
    .pr-btn-l { background: #f3f0f8; color: #4a235f; border: 1px solid #e2d6f0; }
    .pr-btn-d { background: #fdecea; color: #b71c1c; border: 1px solid #f3c6c2; }
    .pr-btn-s { padding: .4rem .8rem; font-size: .82rem; }
    .pr-table { width: 100%; border-collapse: collapse; font-size: .92rem; }
    .pr-table th { text-align: left; padding: .65rem .7rem; color: #7a7280; font-size: .75rem; text-transform: uppercase; letter-spacing: .03em; border-bottom: 2px solid #ece3f2; }
    .pr-table td { padding: .75rem .7rem; border-bottom: 1px solid #f1eaf6; vertical-align: top; }
    .pr-scroll { overflow-x: auto; }
    .pr-badge { display: inline-block; padding: .22rem .65rem; border-radius: 999px; font-size: .76rem; font-weight: 700; white-space: nowrap; }
    .pr-ativa { background: #e6f7eb; color: #1d6b36; } .pr-desligada { background: #eeeeee; color: #666; }
    .pr-encerrada { background: #fdecea; color: #8e1c1c; } .pr-futura { background: #e8f1fd; color: #1a4f8b; }
    .pr-alerta { padding: .9rem 1.1rem; border-radius: 12px; margin-bottom: 1rem; font-size: .92rem; line-height: 1.5; background: #fff8e6; color: #7a5b00; }
    .pr-checks { display: flex; flex-wrap: wrap; gap: .5rem .9rem; }
    .pr-check { display: flex; gap: .45rem; align-items: center; font-size: .92rem; cursor: pointer; }
    .pr-check input { accent-color: #6b2d8f; }
    .pr-total { font-size: 1.4rem; font-weight: 800; color: #4a235f; }
    .pr-acoes { display: flex; gap: .4rem; flex-wrap: wrap; align-items: center; }
    .pr-acoes form { margin: 0; }
</style>

<div class="pr-top">
    <h2>Preços e descontos</h2>
    <p>Valor das mensalidades, descontos, grupos e campanhas. Tudo é criado e apagado por aqui.</p>
</div>

<nav class="pr-tabs">
    <a href="{% url 'precos_admin:regras' %}" class="{% if aba == 'regras' %}ativa{% endif %}">Descontos e campanhas</a>
    <a href="{% url 'precos_admin:combinacoes' %}" class="{% if aba == 'combinacoes' %}ativa{% endif %}">Combinações</a>
    <a href="{% url 'precos_admin:grupos' %}" class="{% if aba == 'grupos' %}ativa{% endif %}">Grupos</a>
    <a href="{% url 'precos_admin:graus' %}" class="{% if aba == 'graus' %}ativa{% endif %}">Parentescos</a>
    <a href="{% url 'precos_admin:simulador' %}" class="{% if aba == 'simulador' %}ativa{% endif %}">Simulador</a>
    <a href="{% url 'precos_admin:configuracao' %}" class="{% if aba == 'configuracao' %}ativa{% endif %}">Arredondamento</a>
</nav>
